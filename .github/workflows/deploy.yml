name: Deploy para o Hostinger

# Roda a cada push na main (ou manualmente pelo botão "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# Impede dois deploys FTP simultâneos de mexerem na mesma árvore do Hostinger
# (rajadas de push corrompiam o estado de sync → uploads completos concorrentes).
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Fail-fast: aborta ANTES do build se as chaves do Supabase estiverem
      # vazias/ausentes (senão o site seria publicado sem conexão ao Supabase).
      # NUNCA imprime o valor do secret.
      - name: Validar secrets do Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::Secret NEXT_PUBLIC_SUPABASE_URL vazio ou ausente. Cadastre em Settings → Secrets and variables → Actions."; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::Secret NEXT_PUBLIC_SUPABASE_ANON_KEY vazio ou ausente. Cadastre em Settings → Secrets and variables → Actions."; exit 1; }
          echo "Secrets do Supabase presentes (valores não exibidos)."

      - name: Gerar o build estático (pasta out/)
        run: npm run build
        env:
          # Chaves do Supabase embutidas no bundle do navegador (NEXT_PUBLIC_*).
          # A anon key é pública por design (protegida por RLS), então pode ser
          # embutida no site estático — mas fica como secret no GitHub.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Publicar via FTP no Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Hostinger aceita FTPS (mais seguro). Se der erro de conexão,
          # troque para: protocol: ftp
          protocol: ftps
          port: 21
          security: loose
          # Sobe o conteúdo do build para a raiz do site.
          local-dir: ./out/
          # Se a sua conta de FTP já abre dentro do public_html, troque para: /
          server-dir: /public_html/
          # Só envia o que mudou (sync incremental); remove arquivos apagados.
          dangerous-clean-slate: false
