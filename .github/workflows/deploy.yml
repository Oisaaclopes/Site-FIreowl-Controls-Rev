name: Deploy para o Hostinger

# Roda a cada push na main (ou manualmente pelo botão "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# Impede dois deploys FTP simultâneos de mexerem na mesma árvore do Hostinger
# (rajadas de push corrompiam o estado de sync → uploads completos concorrentes).
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Fail-fast: aborta ANTES do build se as chaves do Supabase estiverem
      # vazias/ausentes (senão o site seria publicado sem conexão ao Supabase).
      # NUNCA imprime o valor do secret.
      - name: Validar secrets do Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::Secret NEXT_PUBLIC_SUPABASE_URL vazio ou ausente. Cadastre em Settings → Secrets and variables → Actions."; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::Secret NEXT_PUBLIC_SUPABASE_ANON_KEY vazio ou ausente. Cadastre em Settings → Secrets and variables → Actions."; exit 1; }
          echo "Secrets do Supabase presentes (valores não exibidos)."

      - name: Gerar o build estático (pasta out/)
        run: npm run build
        env:
          # Chaves do Supabase embutidas no bundle do navegador (NEXT_PUBLIC_*).
          # A anon key é pública por design (protegida por RLS), então pode ser
          # embutida no site estático — mas fica como secret no GitHub.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}

      # A action anterior fazia upload para arquivos ocultos `.in.*` e depois
      # RNFR/RNTO. O FTP da Hostinger passou a responder 550 nesse rename.
      # lftp envia diretamente (xfer:use-temp-file=false), no mesmo destino.
      - name: Instalar cliente FTPS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Publicar out/ via FTPS no Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # CAUSA RAIZ (confirmada em 2 rounds): (1) `xfer:use-temp-file false`
          # eliminou o `.in.*`+rename recusado pela Hostinger; (2) restou a criação
          # da árvore de diretórios, que o put manual não faz e o `mkdir` avulso do
          # lftp não vinha criando de forma confiável → 550 "No such file".
          # `mirror -R` cria os diretórios e grava direto (com use-temp-file false),
          # mantendo FTPS/porta 21/secrets/destino. SEM --delete (não apaga nada
          # fora de out/); --no-perms (Hostinger recusa chmod 550).
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set xfer:use-temp-file false;
            set ftp:use-site-utime false;
            set ftp:use-site-utime2 false;
            set ftp:use-mdtm false;
            set cmd:fail-exit true;
            set net:max-retries 2;
            set net:timeout 20;
            open -p 21 -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror -R --no-perms --no-symlinks --overwrite --ignore-time --parallel=1 ./out /public_html;
          "
