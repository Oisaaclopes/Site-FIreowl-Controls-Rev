name: Deploy para o Hostinger

# Roda a cada push na main (ou manualmente pelo botão "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# Impede dois deploys FTP simultâneos de mexerem na mesma árvore do Hostinger
# (rajadas de push corrompiam o estado de sync → uploads completos concorrentes).
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Fail-fast: aborta ANTES do build se as chaves do Supabase estiverem
      # vazias/ausentes (senão o site seria publicado sem conexão ao Supabase).
      # NUNCA imprime o valor do secret.
      - name: Validar secrets do Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::Secret NEXT_PUBLIC_SUPABASE_URL vazio ou ausente. Cadastre em Settings → Secrets and variables → Actions."; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::Secret NEXT_PUBLIC_SUPABASE_ANON_KEY vazio ou ausente. Cadastre em Settings → Secrets and variables → Actions."; exit 1; }
          echo "Secrets do Supabase presentes (valores não exibidos)."

      - name: Gerar o build estático (pasta out/)
        run: npm run build
        env:
          # Chaves do Supabase embutidas no bundle do navegador (NEXT_PUBLIC_*).
          # A anon key é pública por design (protegida por RLS), então pode ser
          # embutida no site estático — mas fica como secret no GitHub.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}

      # A action anterior fazia upload para arquivos ocultos `.in.*` e depois
      # RNFR/RNTO. O FTP da Hostinger passou a responder 550 nesse rename.
      # lftp envia diretamente (xfer:use-temp-file=false), no mesmo destino.
      - name: Instalar cliente FTPS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Publicar out/ via FTPS no Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # CAUSA RAIZ: o put via arquivo temporário oculto `.in.*` + rename é
          # recusado (550) pela Hostinger. Correção: `xfer:use-temp-file false`
          # → escreve direto no nome final, sem rename. Sem mirror, sem clean
          # slate: remove só cada arquivo do build e o reenvia (não apaga nada
          # fora de out/). chmod desativado (Hostinger também recusa 550).
          # find | sort garante o PAI antes do FILHO (o caminho do pai é prefixo do
          # filho), então criamos um nível por vez SEM depender de `mkdir -p` do
          # lftp (que não vinha criando a árvore → put caía com 550 "No such file").
          : > /tmp/fireowl-mkdirs.lftp
          find ./out -type d | sort | while IFS= read -r dir; do
            rel="${dir#./out}"
            [ -z "$rel" ] || printf 'mkdir "/public_html%s";\n' "$rel" >> /tmp/fireowl-mkdirs.lftp
          done
          : > /tmp/fireowl-puts.lftp
          find ./out -type f | sort | while IFS= read -r file; do
            rel="${file#./out/}"
            remote="/public_html/$rel"
            remote_dir="${remote%/*}/"
            printf 'rm -f "%s";\nput -O "%s" "%s";\n' "$remote" "$remote_dir" "$file" >> /tmp/fireowl-puts.lftp
          done

          SETTINGS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set xfer:use-temp-file false; set net:max-retries 2; set net:timeout 20;"

          # Fase 1 — cria diretórios; `mkdir -p` em diretório JÁ EXISTENTE responde
          # 550, mas aqui NÃO é fatal (fail-exit false + || true), então não aborta.
          lftp -c "$SETTINGS set cmd:fail-exit false; open -p 21 -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; source /tmp/fireowl-mkdirs.lftp;" || true

          # Fase 2 — envia os arquivos DIRETO (sem `.in.*`/rename). Falha real aqui
          # aborta o deploy (fail-exit true), sem mascarar erro de upload.
          lftp -c "$SETTINGS set cmd:fail-exit true; open -p 21 -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; source /tmp/fireowl-puts.lftp;"
