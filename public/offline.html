<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1A72" />
    <title>Fireowl Guardian — Sem conexão</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: Arial, sans-serif; background: #f8fafc; color: #162033; }
      main { max-width: 420px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 32px 24px; box-shadow: 0 8px 30px #1a1a7212; }
      .mark { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; margin: 0 auto 18px; background: #1a1a72; color: #fff; font-size: 28px; font-weight: 800; }
      h1 { margin: 0; font-size: 21px; } p { color: #64748b; line-height: 1.5; font-size: 14px; } button { border: 0; border-radius: 10px; padding: 13px 20px; color: #fff; background: #1a1a72; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body><main><div class="mark">F</div><h1>Sem conexão</h1><p>Alguns recursos estão temporariamente indisponíveis. Seus registros offline permanecem salvos e serão sincronizados quando a conexão voltar.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
</html>
